[project]
name = "alerts-bi-design"
version = "0.1.0"
requires-python = ">=3.12"
description = "Canonical Alerts BI design and cross-repository contracts"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<0.13", "mypy>=1.13,<2", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the local SQL Server and Elasticsearch mock stack"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests"]
